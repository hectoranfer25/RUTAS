services:
  backend:
    build:
      context: ./backend
    container_name: ids26-e5t8-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATA_FILE: /app/data/input.json
      RANDOM_SEED: ${RANDOM_SEED:-5923}
      MIN_SPEED_KMH: ${MIN_SPEED_KMH:-22}
      MAX_SPEED_KMH: ${MAX_SPEED_KMH:-52}
      TICK_SECONDS: ${TICK_SECONDS:-3}
      SNAP_MAX_METERS: ${SNAP_MAX_METERS:-2000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: ids26-e5t8-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

